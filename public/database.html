<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelola Database — QuickReportHelper</title>
<style>
  :root{ --ink:#16232f; --slate-soft:#6b7a8f; --line:#e2e7ec; --teal:#0f7a6b; --red:#c0392b; --card:#fff; --paper:#f3f5f7; }
  *{box-sizing:border-box;}
  body{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--paper); margin:0; color:var(--ink); }
  header{padding:20px 32px 0; background:var(--card); border-bottom:1px solid var(--line); display:flex; align-items:flex-start; justify-content:space-between; gap:20px;}
  header h1{margin:0 0 14px; font-size:19px;}
  .header-account{display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--slate-soft); white-space:nowrap; padding-top:2px;}
  .header-account button{background:none; border:1px solid var(--line); border-radius:6px; padding:5px 11px; font-size:12px; cursor:pointer; color:var(--ink); font-family:inherit;}
  .header-account button:hover{background:var(--paper);}
  .header-account a{color:var(--teal); text-decoration:none; font-size:12.5px; font-weight:600;}
  .app-tabs{display:flex; gap:2px; padding:0 32px;}
  .app-tabs a{padding:9px 16px; font-size:12.5px; font-weight:600; text-decoration:none; color:var(--slate-soft); border-bottom:2px solid transparent; margin-bottom:-1px;}
  .app-tabs a:hover{color:var(--ink);}
  .app-tabs a.active{color:var(--teal); border-bottom-color:var(--teal);}
  .wrap{ max-width:900px; margin:0 auto; padding:28px 20px 60px; }
  .sub{ font-size:12.5px; color:var(--slate-soft); margin:0 0 20px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:20px; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th,td{ padding:10px 16px; text-align:left; border-bottom:1px solid var(--line); }
  th{ font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--slate-soft); background:#fbfcfd; }
  td.num{ text-align:right; font-variant-numeric:tabular-nums; }
  .del-btn{ background:#fdecea; color:var(--red); border:1px solid #f3c9c4; border-radius:6px; padding:5px 10px; font-size:12px; cursor:pointer; }
  .del-btn:hover{ background:#fbdad6; }
  .status{ font-size:12.5px; color:var(--slate-soft); padding:12px 16px; }
</style>
</head>
<body>
<header>
  <h1>Kelola Database</h1>
  <div class="header-account">
    <span id="whoami"></span>
    <button id="btn-logout">Logout</button>
  </div>
</header>
<div class="app-tabs">
  <a href="/">Data Tersimpan</a>
  <a href="/database" class="active">Kelola Database</a>
  <a href="/users">Kelola User</a>
</div>
<div class="wrap">
  <p class="sub">Semua periode (bulan) yang sudah tersimpan di D1. Hapus periode yang sudah tidak diperlukan dari sini.</p>
  <div class="card">
    <table>
      <thead><tr><th>Periode</th><th class="num">Jumlah Baris</th><th>Terakhir Disimpan</th><th></th></tr></thead>
      <tbody id="periods-body"><tr><td colspan="4" class="status">Memuat...</td></tr></tbody>
    </table>
  </div>
</div>
<script>
fetch('/api/me').then(r => r.ok ? r.json() : null).then(data => {
  if (data && data.email) document.getElementById('whoami').textContent = data.email;
}).catch(() => {});
async function loadPeriods(){
  const body = document.getElementById('periods-body');
  try {
    const res = await fetch('/api/periods');
    if (!res.ok) throw new Error('status ' + res.status);
    const periods = await res.json();
    if (!periods.length){
      body.innerHTML = '<tr><td colspan="4" class="status">Belum ada data tersimpan.</td></tr>';
      return;
    }
    body.innerHTML = periods.map(p => `
      <tr>
        <td>${p.label || (p.month + '/' + p.year)}</td>
        <td class="num">${p.row_count}</td>
        <td>${new Date(p.uploaded_at + 'Z').toLocaleString('id-ID')}</td>
        <td><button class="del-btn" data-year="${p.year}" data-month="${p.month}" data-label="${(p.label||'').replace(/"/g,'&quot;')}">Hapus</button></td>
      </tr>`).join('');
    body.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const { year, month, label } = btn.dataset;
        if (!confirm(`Hapus data "${label}"? Tindakan ini tidak bisa dibatalkan.`)) return;
        btn.disabled = true; btn.textContent = 'Menghapus...';
        try {
          const res = await fetch(`/api/periods/${year}/${month}`, { method: 'DELETE' });
          if (!res.ok) throw new Error('status ' + res.status);
          loadPeriods();
        } catch (err) {
          alert('Gagal menghapus: ' + err.message);
          btn.disabled = false; btn.textContent = 'Hapus';
        }
      });
    });
  } catch (err) {
    body.innerHTML = `<tr><td colspan="4" class="status">Gagal memuat: ${err.message}</td></tr>`;
  }
}
document.getElementById('btn-logout').addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' });
  window.location.href = '/login';
});
loadPeriods();
</script>
</body>
</html>
