<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelola User — QuickReportHelper</title>
<style>
  :root{ --ink:#16232f; --slate-soft:#6b7a8f; --line:#e2e7ec; --teal:#0f7a6b; --red:#c0392b; --card:#fff; --paper:#f3f5f7; }
  *{box-sizing:border-box;}
  body{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--paper); margin:0; color:var(--ink); }
  header{padding:20px 32px 0; background:var(--card); border-bottom:1px solid var(--line); display:flex; align-items:flex-start; justify-content:space-between; gap:20px;}
  header h1{margin:0 0 14px; font-size:19px;}
  .header-account{display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--slate-soft); white-space:nowrap; padding-top:2px;}
  .header-account button{background:none; border:1px solid var(--line); border-radius:6px; padding:5px 11px; font-size:12px; cursor:pointer; color:var(--ink); font-family:inherit;}
  .header-account button:hover{background:var(--paper);}
  .app-tabs{display:flex; gap:2px; padding:0 32px;}
  .app-tabs a{padding:9px 16px; font-size:12.5px; font-weight:600; text-decoration:none; color:var(--slate-soft); border-bottom:2px solid transparent; margin-bottom:-1px;}
  .app-tabs a:hover{color:var(--ink);}
  .app-tabs a.active{color:var(--teal); border-bottom-color:var(--teal);}
  .wrap{ max-width:640px; margin:0 auto; padding:28px 20px 60px; }
  .sub{ font-size:12.5px; color:var(--slate-soft); margin:0 0 20px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:20px; }
  .card h2{ margin:0; padding:12px 16px; font-size:13.5px; border-bottom:1px solid var(--line); background:#fbfcfd; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th,td{ padding:10px 16px; text-align:left; border-bottom:1px solid var(--line); }
  th{ font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--slate-soft); background:#fbfcfd; }
  .del-btn{ background:#fdecea; color:var(--red); border:1px solid #f3c9c4; border-radius:6px; padding:5px 10px; font-size:12px; cursor:pointer; }
  .del-btn:hover{ background:#fbdad6; }
  .status{ font-size:12.5px; color:var(--slate-soft); padding:12px 16px; }
  form{ padding:16px; display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  label{ font-size:11.5px; font-weight:600; color:var(--slate-soft); display:block; margin-bottom:4px; }
  input{ padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:13px; min-width:180px; }
  button.primary{ background:var(--teal); color:#fff; border:none; border-radius:6px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer; }
  .err{ color:var(--red); font-size:12.5px; padding:0 16px 12px; }
  @keyframes pageFade{ from{opacity:0;} to{opacity:1;} }
  @keyframes cardIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  @keyframes popIn{ from{opacity:0; transform:translateY(-4px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);} }
  body{ animation:pageFade .2s ease; }
  button, select, input, a{ transition:background-color .15s ease, border-color .15s ease, color .15s ease, transform .1s ease; }
  button:active{ transform:scale(.96); }
  .card{ animation:cardIn .25s ease both; }
  .bot-helper{ position:relative; }
  .bot-helper button{
    background:none; border:1px solid var(--line); border-radius:50%; width:30px; height:30px;
    font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; line-height:1;
  }
  .bot-helper button:hover{ background:var(--paper); border-color:var(--teal); }
  .bot-bubble{
    position:absolute; top:calc(100% + 10px); right:0; width:260px;
    background:#fff; border:1px solid var(--line); border-radius:12px; padding:13px 15px;
    font-size:12.5px; line-height:1.55; color:var(--ink); box-shadow:0 6px 20px rgba(20,30,45,.14);
    display:none; z-index:30; text-align:left; white-space:normal; overflow-wrap:break-word;
  }
  .bot-bubble.show{ display:block; animation:popIn .18s ease; }
  .bot-bubble::after{
    content:''; position:absolute; top:-6px; right:13px; width:11px; height:11px;
    background:#fff; border-left:1px solid var(--line); border-top:1px solid var(--line); transform:rotate(45deg);
  }
  .bot-bubble b{ display:block; margin-bottom:4px; color:var(--teal); }
  @keyframes botFloat{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-2px);} }
  .bot-helper button{ border:none; border-radius:10px; width:36px; height:36px; padding:2px; background:none; }
  .bot-helper button:hover{ background:var(--paper); border:none; }
  .bot-helper button img{ width:100%; height:100%; object-fit:contain; display:block; animation:botFloat 3.2s ease-in-out infinite; }
</style>
</head>
<body>
<header>
  <h1>Kelola User</h1>
  <div class="header-account">
    <span id="whoami"></span>
    <div class="bot-helper">
      <button id="btn-bot" aria-label="Bantuan" title="Bantuan"><img src="/robot.png" alt="Bantuan"></button>
      <div class="bot-bubble" id="bot-bubble">
        <b>Cara pakai halaman ini</b>
        Tambah akun baru (email + password) di form atas biar rekan kerja bisa login. Klik "Hapus" di daftar bawah buat cabut akses seseorang.
      </div>
    </div>
    <button id="btn-logout">Logout</button>
  </div>
</header>
<div class="app-tabs">
  <a href="/">Data Tersimpan</a>
  <a href="/database">Kelola Database</a>
  <a href="/users" class="active">Kelola User</a>
  <a href="/config">Konfigurasi Kolom</a>
</div>
<div class="wrap">
  <div class="card">
    <h2>Tambah User Baru</h2>
    <form id="add-form">
      <div>
        <label>Email</label>
        <input type="email" id="new-email" required>
      </div>
      <div>
        <label>Password</label>
        <input type="password" id="new-password" minlength="6" required>
      </div>
      <button type="submit" class="primary">Tambah</button>
    </form>
    <div class="err" id="add-err"></div>
  </div>

  <div class="card">
    <h2>Daftar User</h2>
    <table>
      <thead><tr><th>Email</th><th>Dibuat</th><th></th></tr></thead>
      <tbody id="users-body"><tr><td colspan="3" class="status">Memuat...</td></tr></tbody>
    </table>
  </div>
</div>
<script>
document.getElementById('btn-bot').addEventListener('click', (e) => {
  e.stopPropagation();
  document.getElementById('bot-bubble').classList.toggle('show');
});
document.addEventListener('click', (e) => {
  const bubble = document.getElementById('bot-bubble');
  if (bubble.classList.contains('show') && !e.target.closest('.bot-helper')) bubble.classList.remove('show');
});
async function loadUsers(){
  fetch('/api/me').then(r => r.ok ? r.json() : null).then(data => {
    if (data && data.email) document.getElementById('whoami').textContent = data.email;
  }).catch(() => {});
  const body = document.getElementById('users-body');
  try {
    const res = await fetch('/api/users');
    if (!res.ok) throw new Error('status ' + res.status);
    const users = await res.json();
    if (!users.length){ body.innerHTML = '<tr><td colspan="3" class="status">Belum ada user.</td></tr>'; return; }
    body.innerHTML = users.map(u => `
      <tr>
        <td>${u.email}</td>
        <td>${new Date(u.created_at + 'Z').toLocaleString('id-ID')}</td>
        <td><button class="del-btn" data-id="${u.id}" data-email="${u.email}">Hapus</button></td>
      </tr>`).join('');
    body.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const { id, email } = btn.dataset;
        if (!confirm(`Hapus user "${email}"?`)) return;
        btn.disabled = true; btn.textContent = 'Menghapus...';
        try {
          const res = await fetch(`/api/users/${id}`, { method: 'DELETE' });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || ('status ' + res.status));
          loadUsers();
        } catch (err) {
          alert('Gagal menghapus: ' + err.message);
          btn.disabled = false; btn.textContent = 'Hapus';
        }
      });
    });
  } catch (err) {
    body.innerHTML = `<tr><td colspan="3" class="status">Gagal memuat: ${err.message}</td></tr>`;
  }
}
document.getElementById('add-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('add-err');
  errEl.textContent = '';
  const email = document.getElementById('new-email').value;
  const password = document.getElementById('new-password').value;
  try {
    const res = await fetch('/api/users', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Gagal menambah user');
    document.getElementById('new-email').value = '';
    document.getElementById('new-password').value = '';
    loadUsers();
  } catch (err) {
    errEl.textContent = err.message;
  }
});
document.getElementById('btn-logout').addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' });
  window.location.href = '/login';
});
loadUsers();
</script>
</body>
</html>
