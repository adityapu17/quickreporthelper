<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelola User — QuickReportHelper</title>
<style>
  :root{ --ink:#16232f; --slate-soft:#6b7a8f; --line:#e2e7ec; --teal:#0f7a6b; --red:#c0392b; }
  *{box-sizing:border-box;}
  body{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#f3f5f7; margin:0; color:var(--ink); }
  .wrap{ max-width:640px; margin:0 auto; padding:28px 20px 60px; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  .topbar a{ color:var(--teal); text-decoration:none; font-size:13.5px; font-weight:600; }
  h1{ font-size:19px; margin:0 0 4px; }
  .sub{ font-size:12.5px; color:var(--slate-soft); margin:0 0 20px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:20px; }
  .card h2{ margin:0; padding:12px 16px; font-size:13.5px; border-bottom:1px solid var(--line); background:#fbfcfd; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th,td{ padding:10px 16px; text-align:left; border-bottom:1px solid var(--line); }
  th{ font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--slate-soft); background:#fbfcfd; }
  .del-btn{ background:#fdecea; color:var(--red); border:1px solid #f3c9c4; border-radius:6px; padding:5px 10px; font-size:12px; cursor:pointer; }
  .del-btn:hover{ background:#fbdad6; }
  .status{ font-size:12.5px; color:var(--slate-soft); padding:12px 16px; }
  form{ padding:16px; display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  label{ font-size:11.5px; font-weight:600; color:var(--slate-soft); display:block; margin-bottom:4px; }
  input{ padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:13px; min-width:180px; }
  button.primary{ background:var(--teal); color:#fff; border:none; border-radius:6px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer; }
  button#btn-logout{ background:none; border:1px solid var(--line); border-radius:6px; padding:6px 12px; font-size:12.5px; cursor:pointer; color:var(--slate-soft); }
  .err{ color:var(--red); font-size:12.5px; padding:0 16px 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a href="/">&larr; Kembali ke QuickReportHelper</a>
    <button id="btn-logout">Logout</button>
  </div>
  <h1>Kelola User</h1>
  <p class="sub">Akun yang bisa login ke QuickReportHelper.</p>

  <div class="card">
    <h2>Tambah User Baru</h2>
    <form id="add-form">
      <div>
        <label>Email</label>
        <input type="email" id="new-email" required>
      </div>
      <div>
        <label>Password</label>
        <input type="password" id="new-password" minlength="6" required>
      </div>
      <button type="submit" class="primary">Tambah</button>
    </form>
    <div class="err" id="add-err"></div>
  </div>

  <div class="card">
    <h2>Daftar User</h2>
    <table>
      <thead><tr><th>Email</th><th>Dibuat</th><th></th></tr></thead>
      <tbody id="users-body"><tr><td colspan="3" class="status">Memuat...</td></tr></tbody>
    </table>
  </div>
</div>
<script>
async function loadUsers(){
  const body = document.getElementById('users-body');
  try {
    const res = await fetch('/api/users');
    if (!res.ok) throw new Error('status ' + res.status);
    const users = await res.json();
    if (!users.length){ body.innerHTML = '<tr><td colspan="3" class="status">Belum ada user.</td></tr>'; return; }
    body.innerHTML = users.map(u => `
      <tr>
        <td>${u.email}</td>
        <td>${new Date(u.created_at + 'Z').toLocaleString('id-ID')}</td>
        <td><button class="del-btn" data-id="${u.id}" data-email="${u.email}">Hapus</button></td>
      </tr>`).join('');
    body.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const { id, email } = btn.dataset;
        if (!confirm(`Hapus user "${email}"?`)) return;
        btn.disabled = true; btn.textContent = 'Menghapus...';
        try {
          const res = await fetch(`/api/users/${id}`, { method: 'DELETE' });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || ('status ' + res.status));
          loadUsers();
        } catch (err) {
          alert('Gagal menghapus: ' + err.message);
          btn.disabled = false; btn.textContent = 'Hapus';
        }
      });
    });
  } catch (err) {
    body.innerHTML = `<tr><td colspan="3" class="status">Gagal memuat: ${err.message}</td></tr>`;
  }
}
document.getElementById('add-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('add-err');
  errEl.textContent = '';
  const email = document.getElementById('new-email').value;
  const password = document.getElementById('new-password').value;
  try {
    const res = await fetch('/api/users', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Gagal menambah user');
    document.getElementById('new-email').value = '';
    document.getElementById('new-password').value = '';
    loadUsers();
  } catch (err) {
    errEl.textContent = err.message;
  }
});
document.getElementById('btn-logout').addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' });
  window.location.href = '/login.html';
});
loadUsers();
</script>
</body>
</html>
