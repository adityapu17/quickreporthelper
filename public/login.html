<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — QuickReportHelper</title>
<style>
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#f3f5f7; min-height:100vh; margin:0;
    display:flex; align-items:center; justify-content:center;
  }
  .box{
    background:#fff; border:1px solid #e2e7ec; border-radius:12px;
    padding:32px; width:100%; max-width:360px; box-shadow:0 2px 8px rgba(20,30,40,.06);
  }
  h1{font-size:17px; margin:0 0 6px; color:#16232f;}
  p{font-size:12.5px; color:#6b7a8f; margin:0 0 20px;}
  label{font-size:12px; font-weight:600; color:#425066; display:block; margin-bottom:4px;}
  input{
    width:100%; padding:10px 12px; border:1px solid #d9e0e8; border-radius:8px;
    font-size:14px; margin-bottom:14px;
  }
  button{
    width:100%; padding:10px 12px; border:none; border-radius:8px;
    background:#0f7a6b; color:#fff; font-weight:600; font-size:14px; cursor:pointer;
  }
  button:disabled{opacity:.6; cursor:default;}
  .err{color:#c0392b; font-size:12.5px; margin-top:10px; min-height:16px;}
  .badge{display:inline-block; background:#e8f5f2; color:#0f7a6b; font-size:11px; font-weight:700; padding:3px 8px; border-radius:5px; margin-bottom:10px;}
  @keyframes boxIn{ from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);} }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }
  .box{ animation:boxIn .3s ease both; }
  .box.shake{ animation:shake .3s ease; }
  input, button{ transition:border-color .15s ease, box-shadow .15s ease, transform .1s ease, background-color .15s ease, opacity .15s ease; }
  input:focus{ outline:none; border-color:#0f7a6b; box-shadow:0 0 0 3px rgba(15,122,107,.12); }
  button:active:not(:disabled){ transform:scale(.97); }
  button.loading::before{ content:''; display:inline-block; width:12px; height:12px; margin-right:8px; vertical-align:-2px;
    border:2px solid rgba(255,255,255,.5); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; }
  .err{ transition:opacity .2s ease; }
</style>
</head>
<body>
  <form class="box" id="auth-form">
    <div id="badge-wrap"></div>
    <h1 id="title">QuickReportHelper</h1>
    <p id="subtitle"></p>
    <label>Email</label>
    <input type="email" id="email" required autofocus>
    <label>Password</label>
    <input type="password" id="password" required minlength="6">
    <div id="confirm-wrap" style="display:none;">
      <label>Ulangi Password</label>
      <input type="password" id="confirm" minlength="6">
    </div>
    <button type="submit" id="btn">Masuk</button>
    <div class="err" id="err"></div>
  </form>
  <script>
    let bootstrapMode = false;

    async function init(){
      try {
        const res = await fetch('/api/users-count');
        const data = await res.json();
        bootstrapMode = data.count === 0;
      } catch (e) { bootstrapMode = false; }
      if (bootstrapMode){
        document.getElementById('badge-wrap').innerHTML = '<span class="badge">SETUP PERTAMA KALI</span>';
        document.getElementById('subtitle').textContent = 'Buat akun admin pertama.';
        document.getElementById('confirm-wrap').style.display = '';
        document.getElementById('btn').textContent = 'Buat Akun & Masuk';
      } else {
        document.getElementById('subtitle').textContent = '';
        document.getElementById('btn').textContent = 'Masuk';
      }
    }

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const err = document.getElementById('err');
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      err.textContent = '';

      if (bootstrapMode){
        const confirm = document.getElementById('confirm').value;
        if (password !== confirm){ err.textContent = 'Password tidak sama.'; return; }
      }

      btn.disabled = true; btn.classList.add('loading'); btn.textContent = 'Memproses...';
      try {
        if (bootstrapMode){
          const createRes = await fetch('/api/users', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const createData = await createRes.json();
          if (!createRes.ok) throw new Error(createData.error || 'Gagal membuat akun');
        }
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login gagal');
        window.location.href = '/';
      } catch (ex) {
        err.textContent = ex.message;
        const boxEl = document.getElementById('auth-form'); boxEl.classList.remove('shake'); void boxEl.offsetWidth; boxEl.classList.add('shake');
        btn.classList.remove('loading');
        btn.disabled = false; btn.textContent = bootstrapMode ? 'Buat Akun & Masuk' : 'Masuk';
      }
    });

    init();
  </script>
</body>
</html>
