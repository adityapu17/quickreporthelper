<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konfigurasi Kolom — QuickReportHelper</title>
<style>
  :root{ --ink:#16232f; --slate-soft:#6b7a8f; --line:#e2e7ec; --teal:#0f7a6b; --red:#c0392b; --card:#fff; --paper:#f3f5f7; }
  *{box-sizing:border-box;}
  body{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--paper); margin:0; color:var(--ink); }
  header{padding:20px 32px 0; background:var(--card); border-bottom:1px solid var(--line); display:flex; align-items:flex-start; justify-content:space-between; gap:20px;}
  header h1{margin:0 0 14px; font-size:19px;}
  .header-account{display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--slate-soft); white-space:nowrap; padding-top:2px;}
  .header-account button{background:none; border:1px solid var(--line); border-radius:6px; padding:5px 11px; font-size:12px; cursor:pointer; color:var(--ink); font-family:inherit;}
  .header-account button:hover{background:var(--paper);}
  .app-tabs{display:flex; gap:2px; padding:0 32px;}
  .app-tabs a{padding:9px 16px; font-size:12.5px; font-weight:600; text-decoration:none; color:var(--slate-soft); border-bottom:2px solid transparent; margin-bottom:-1px;}
  .app-tabs a:hover{color:var(--ink);}
  .app-tabs a.active{color:var(--teal); border-bottom-color:var(--teal);}
  .wrap{ max-width:780px; margin:0 auto; padding:28px 20px 60px; }
  .sub{ font-size:12.5px; color:var(--slate-soft); margin:0 0 20px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:20px; }
  .card h2{ margin:0; padding:12px 16px; font-size:13.5px; border-bottom:1px solid var(--line); background:#fbfcfd; }
  .field-row{ display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); }
  .field-row:last-child{ border-bottom:none; }
  .field-label{ flex:1; font-size:13px; }
  .field-label .key{ display:block; font-size:11px; color:var(--slate-soft); font-family:monospace; margin-top:2px; }
  .field-row input{ width:220px; padding:7px 9px; border:1px solid var(--line); border-radius:6px; font-size:12.5px; font-family:monospace; }
  .field-row input::placeholder{ color:#b7c0cb; }
  .save-bar{ position:sticky; bottom:0; background:#fff; border-top:1px solid var(--line); padding:14px 16px; display:flex; align-items:center; gap:12px; }
  button.primary{ background:var(--teal); color:#fff; border:none; border-radius:6px; padding:9px 18px; font-size:13px; font-weight:600; cursor:pointer; }
  .status{ font-size:12.5px; color:var(--slate-soft); }
  .hint{ font-size:12px; color:var(--slate-soft); background:#fbfcfd; padding:12px 16px; border-bottom:1px solid var(--line); }
</style>
</head>
<body>
<header>
  <h1>Konfigurasi Kolom</h1>
  <div class="header-account">
    <span id="whoami"></span>
    <button id="btn-logout">Logout</button>
  </div>
</header>
<div class="app-tabs">
  <a href="/">Data Tersimpan</a>
  <a href="/database">Kelola Database</a>
  <a href="/users">Kelola User</a>
  <a href="/config" class="active">Konfigurasi Kolom</a>
</div>
<div class="wrap">
  <p class="sub">Nama kolom Excel/CSV yang dicari tiap file. Kosongkan = pakai default bawaan. Ubah di sini kalau susunan kolom file berubah, supaya hasilnya tetap benar tanpa perlu edit kode.</p>
  <div id="groups"></div>
  <div class="save-bar">
    <button class="primary" id="btn-save">Simpan Konfigurasi</button>
    <span class="status" id="save-status"></span>
  </div>
</div>
<script>
const FIELD_DEFAULTS = {
  ticket_id: 'ticket_id',
  ticket_channel_name: 'channel_name',
  ticket_subCategory: 'subCategory',
  ticket_mainCategory: 'mainCategory',
  ticket_is_escalated: 'is_escalated',
  ticket_source_name: 'source_name',
  ticket_date_start: 'date_start_interaction',
  ticket_date_open: 'date_open',
  ticket_date_end: 'date_end_interaction',
  ticket_detailSubCategory: 'detailSubCategory',
  ticket_customer_hp: 'customer_hp',
  ticket_customer_email: 'customer_email',
  ticket_customer_category: 'ticket_Customer_Category',
  ticket_company: '',
  detail_id_interaction: 'id_interaction',
  detail_session_id: 'session_id',
  detail_channel_name: 'channel_name',
  detail_action_type: 'action_type',
  detail_date_received: 'date_received',
  voice_event: 'event',
  voice_talktime: 'talktime',
  voice_datetime: 'datetime'
};
const FIELD_LABELS = {
  ticket_id: 'ID Ticket',
  ticket_channel_name: 'Channel (Voice/Email/WhatsApp)',
  ticket_subCategory: 'Sub Category — dipakai deteksi Produk E-Meterai/Digital Sign',
  ticket_mainCategory: 'Main Category (Informasi/Permintaan/Keluhan)',
  ticket_is_escalated: 'Status Escalated',
  ticket_source_name: 'Source Name',
  ticket_date_start: 'Tanggal Mulai Interaksi — dasar Handling Time & Escalation Time',
  ticket_date_open: 'Tanggal Open/Escalated — dasar Escalation Time',
  ticket_date_end: 'Tanggal Selesai Interaksi — dasar Handling Time',
  ticket_detailSubCategory: 'Detail Sub Category',
  ticket_customer_hp: 'No. HP Customer',
  ticket_customer_email: 'Email Customer — dipakai sbg PIC di Sample Handling',
  ticket_customer_category: 'Kategori Customer — dipakai deteksi "Pemungut"',
  ticket_company: 'Nama Company (kosongkan = auto-detect kolom yang mengandung kata "company")',
  detail_id_interaction: 'ID Interaction',
  detail_session_id: 'Session ID',
  detail_channel_name: 'Channel',
  detail_action_type: 'Action Type (IN/OUT) — dasar Response Time',
  detail_date_received: 'Tanggal Diterima Pesan',
  voice_event: 'Event — dipakai deteksi ABANDON',
  voice_talktime: 'Talk Time (durasi panggilan) — dasar AHT',
  voice_datetime: 'Tanggal/Waktu Panggilan'
};
const GROUPS = [
  { title: 'File Ticket', keys: ['ticket_id','ticket_channel_name','ticket_subCategory','ticket_mainCategory','ticket_is_escalated','ticket_source_name','ticket_date_start','ticket_date_open','ticket_date_end','ticket_detailSubCategory','ticket_customer_hp','ticket_customer_email','ticket_customer_category','ticket_company'] },
  { title: 'File Detail Interaction (non-voice)', keys: ['detail_id_interaction','detail_session_id','detail_channel_name','detail_action_type','detail_date_received'] },
  { title: 'File Detail Interaction Voice', keys: ['voice_event','voice_talktime','voice_datetime'] }
];

let currentConfig = {};

function render(){
  const groupsEl = document.getElementById('groups');
  groupsEl.innerHTML = GROUPS.map(g => `
    <div class="card">
      <h2>${g.title}</h2>
      ${g.keys.map(k => `
        <div class="field-row">
          <div class="field-label">${FIELD_LABELS[k]}<span class="key">${k}</span></div>
          <input type="text" data-key="${k}" value="${currentConfig[k] || ''}" placeholder="${FIELD_DEFAULTS[k] || '(auto-detect)'}">
        </div>
      `).join('')}
    </div>
  `).join('');
}

async function load(){
  fetch('/api/me').then(r => r.ok ? r.json() : null).then(data => {
    if (data && data.email) document.getElementById('whoami').textContent = data.email;
  }).catch(() => {});
  try {
    const res = await fetch('/api/column-config');
    currentConfig = res.ok ? await res.json() : {};
  } catch (e) { currentConfig = {}; }
  render();
}

document.getElementById('btn-save').addEventListener('click', async () => {
  const status = document.getElementById('save-status');
  const config = {};
  document.querySelectorAll('input[data-key]').forEach(inp => { config[inp.dataset.key] = inp.value.trim(); });
  status.textContent = 'Menyimpan...';
  try {
    const res = await fetch('/api/column-config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ config })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Gagal menyimpan');
    currentConfig = config;
    status.textContent = 'Tersimpan ✓';
    setTimeout(() => { status.textContent = ''; }, 2000);
  } catch (err) {
    status.textContent = 'Error: ' + err.message;
  }
});

document.getElementById('btn-logout').addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' });
  window.location.href = '/login';
});

load();
</script>
</body>
</html>
